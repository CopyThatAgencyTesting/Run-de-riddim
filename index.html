<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#7A5C6E">
<title>Protected &#183; CamCom</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');:root{--plum:#7A5C6E;--plum-dk:#63495A;--plum-soft:#EFE7ED;--ink:#26202A;--muted:#7C7280;--faint:#9A8F98;--paper:#F5F1F4;--surface:#FFFFFF;--raise:#FBF9FB;--line:#E6DDE4;--line-2:#D8CCD5;--accent:#7A5C6E;--accent-2:#63495A;--video:#3E6E8E;--dco:#8A5A4E;--static:#5E7A55;--heat:#B5474B;--shadow:0 1px 2px rgba(38,32,42,.05),0 8px 24px -12px rgba(38,32,42,.18);--serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:'IBM Plex Sans',-apple-system,system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#EDE6EC;--muted:#A99EAB;--faint:#8B8090;--paper:#17131A;--surface:#211B26;--raise:#271F2D;--line:#352B3B;--line-2:#443848;--plum-soft:#2C2230;--accent:#C9A7BE;--accent-2:#B591AA;--video:#7FB0CE;--dco:#D0937F;--static:#9CC08C;--heat:#E4787B;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6)}}:root[data-theme="dark"]{--ink:#EDE6EC;--muted:#A99EAB;--faint:#8B8090;--paper:#17131A;--surface:#211B26;--raise:#271F2D;--line:#352B3B;--line-2:#443848;--plum-soft:#2C2230;--accent:#C9A7BE;--accent-2:#B591AA;--video:#7FB0CE;--dco:#D0937F;--static:#9CC08C;--heat:#E4787B;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}.wrap{max-width:1120px;margin:0 auto;padding:0 24px}.mast{padding:52px 0 30px;border-bottom:1px solid var(--line)}.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-2);margin:0 0 16px;display:flex;gap:10px;align-items:center}.eyebrow::before{content:"";width:26px;height:2px;background:var(--accent);display:inline-block}h1{font-family:var(--serif);font-optical-sizing:auto;font-weight:900;font-size:clamp(34px,5.4vw,58px);line-height:1.02;letter-spacing:-.015em;margin:0 0 18px;text-wrap:balance}h1 em{font-style:italic;font-weight:400;color:var(--accent)}.lede{max-width:64ch;font-size:17px;color:var(--muted);margin:0}.runbar{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:26px;font-family:var(--mono);font-size:12.5px;color:var(--faint)}.runbar b{color:var(--ink);font-weight:500}.runbar .k{color:var(--accent-2)}.summary{padding:34px 0 8px}.summary h2.sec{font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin:0 0 18px}.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}.sumcard{background:var(--surface);padding:22px 22px 24px}.sumcard .name{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}.sumcard .name h3{font-family:var(--serif);font-weight:600;font-size:22px;margin:0}.sumcard .count{font-family:var(--mono);font-size:12px;color:var(--accent-2);background:var(--plum-soft);padding:2px 8px;border-radius:20px}.sumcard p{margin:0;font-size:14px;color:var(--muted)}.sumcard.dormant{background:var(--raise)}.sumcard.dormant ul{list-style:none;margin:6px 0 0;padding:0;font-size:14px;color:var(--muted)}.sumcard.dormant li{display:flex;gap:9px;align-items:flex-start}.sumcard.dormant .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);margin-top:6px;flex:none}.filters{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;padding:16px 0;margin-top:30px;background:var(--paper);border-bottom:1px solid var(--line)}.fb{font-family:var(--mono);font-size:12.5px;letter-spacing:.03em;color:var(--muted);background:transparent;border:1px solid var(--line-2);padding:7px 14px;border-radius:20px;cursor:pointer;transition:.15s}.fb:hover{border-color:var(--accent);color:var(--accent-2)}.fb.on{background:var(--accent);border-color:var(--accent);color:#fff}:root[data-theme="dark"] .fb.on,:root:not([data-theme="light"]) .fb.on{color:#1b1420}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fb.on{color:#1b1420}}.brand-block{padding:38px 0 10px}.brand-head{margin-bottom:22px}.brand-head h2{font-family:var(--serif);font-weight:900;font-size:30px;margin:0 0 6px;letter-spacing:-.01em}.brand-meta{font-family:var(--mono);font-size:12.5px;color:var(--faint);margin:0 0 12px}.brand-meta strong{color:var(--accent-2)}.brand-strat{max-width:78ch;font-size:14.5px;color:var(--muted);margin:0;padding-left:16px;border-left:2px solid var(--line-2)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;margin-top:20px}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:.18s}.card:hover{transform:translateY(-2px);border-color:var(--line-2)}.card-top{display:flex;gap:7px;align-items:center;margin-bottom:12px}.chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:5px;font-weight:500}.chip.date{color:var(--faint);background:var(--raise);border:1px solid var(--line);margin-left:auto}.f-video{color:#fff;background:var(--video)}.f-dco{color:#fff;background:var(--dco)}.f-static{color:#fff;background:var(--static)}.f-carousel{color:#fff;background:var(--accent-2)}:root[data-theme="dark"] .f-video,:root[data-theme="dark"] .f-dco,:root[data-theme="dark"] .f-static{color:#17131a}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .f-video,:root:not([data-theme="light"]) .f-dco,:root:not([data-theme="light"]) .f-static{color:#17131a}}.offer{font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.15;margin:0 0 8px;letter-spacing:-.01em;text-wrap:balance}.hook{font-size:14px;color:var(--ink);margin:0 0 14px}.borrow{background:var(--plum-soft);border-radius:10px;padding:13px 14px;margin-bottom:16px}.borrow-tag{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-2);font-weight:600;display:block;margin-bottom:6px}.borrow p{margin:0;font-size:13px;color:var(--ink);line-height:1.48}.card-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid var(--line)}.variants{display:flex;align-items:center;gap:7px}.vnum{font-family:var(--mono);font-weight:500;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}.variants.heavy .vnum{color:var(--heat)}.vlabel{font-size:11px;color:var(--faint)}.vbar{width:52px;height:5px;background:var(--line);border-radius:3px;overflow:hidden}.vbar span{display:block;height:100%;background:var(--accent);border-radius:3px}.variants.heavy .vbar span{background:var(--heat)}.viewad{font-family:var(--mono);font-size:12px;color:var(--accent-2);text-decoration:none;white-space:nowrap;border-bottom:1px solid transparent;padding-bottom:1px}.viewad:hover{border-bottom-color:var(--accent)}footer.foot{margin-top:48px;padding:26px 0 60px;border-top:1px solid var(--line);font-family:var(--mono);font-size:12px;color:var(--faint)}footer.foot p{margin:0 0 6px}footer.foot .gate{color:var(--accent-2)}a{color:var(--accent-2)}:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}@media (prefers-reduced-motion:reduce){*{transition:none!important}.card:hover{transform:none}}@media (max-width:560px){.mast{padding:36px 0 24px}.grid{grid-template-columns:1fr}}
.gatewrap{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.gatecard{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  padding:34px 30px;max-width:360px;width:100%;text-align:center;}
.gatecard .lock{font-size:26px;margin-bottom:6px;}
.gatecard h1{font-family:var(--serif);font-weight:900;font-size:24px;margin:0 0 6px;letter-spacing:-.01em;}
.gatecard p.sub{font-size:13px;color:var(--muted);margin:0 0 20px;}
.gatecard input{width:100%;box-sizing:border-box;font-family:var(--sans);font-size:15px;padding:12px 14px;
  border:1px solid var(--line-2);border-radius:10px;background:var(--raise);color:var(--ink);margin-bottom:12px;}
.gatecard input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.gatecard button{width:100%;font-family:var(--mono);font-size:13px;letter-spacing:.04em;padding:12px;border:0;
  border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;}
.gatecard button:hover{background:var(--accent-2);}
.gatecard button:disabled{opacity:.6;cursor:default;}
.gateerr{color:var(--heat);font-size:12.5px;min-height:16px;margin-top:10px;font-family:var(--mono);}
.gatenote{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:18px;line-height:1.5;}
.card{padding:0;overflow:hidden}
.card-pad{padding:16px 18px 14px;display:flex;flex-direction:column;flex:1}
.card-art{position:relative;display:block;aspect-ratio:1/1;background:var(--raise);overflow:hidden;border-bottom:1px solid var(--line)}
.card-art .thumb{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.card-art img.thumb{transition:transform .2s}
.card:hover .card-art img.thumb{transform:scale(1.03)}
.card-art.noimg{display:flex;align-items:center;justify-content:center;aspect-ratio:16/10}
.card-art.noimg::after{content:"Creative on Meta \2197";font-family:var(--mono);font-size:11px;color:var(--faint)}
.card-art.noimg .thumb{display:none}
.fmt-badge{position:absolute;top:10px;left:10px;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:5px;font-weight:500;z-index:2;pointer-events:none}
.art-meta{position:absolute;top:10px;right:10px;font-family:var(--mono);font-size:10px;color:#fff;background:rgba(0,0,0,.62);padding:3px 8px;border-radius:5px;text-decoration:none;z-index:3}
.art-meta:hover{background:var(--accent-2)}
.card-top{margin-bottom:8px}
[hidden]{display:none!important}
.art-slot{width:100%;height:100%}
.art-slot .thumb{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.card:hover .art-slot img.thumb{transform:scale(1.03)}
.art-nav{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:17px;line-height:1;cursor:pointer;z-index:4;display:flex;align-items:center;justify-content:center;padding:0}
.art-nav:hover{background:var(--accent-2)}
.art-nav.prev{left:8px}
.art-nav.next{right:8px}
.art-count{position:absolute;bottom:10px;left:10px;font-family:var(--mono);font-size:10px;color:#fff;background:rgba(0,0,0,.6);padding:3px 7px;border-radius:5px;z-index:3;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="gate" class="gatewrap"><div class="gatecard"><div class="lock">&#128274;</div><h1>CamCom &middot; Rival Watch</h1><p class="sub">Competitor creative board. Enter the team password to decrypt.</p><form id="gateform"><input id="pw" type="password" placeholder="Password" autofocus autocomplete="current-password"><button id="go" type="submit">Unlock</button></form><div id="err" class="gateerr"></div><p class="gatenote">Encrypted client-side (AES-GCM). Nothing readable is stored on the server.</p></div></div>
<div id="app" class="wrap-host" hidden></div>
<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fmtClass(f){return {DCO:"f-dco",VIDEO:"f-video",IMAGE:"f-static",CAROUSEL:"f-carousel"}[f]||"f-static";}
function mediaEl(item){
  if(item && item.video) return '<video class="thumb" controls playsinline preload="metadata"'+(item.img?' poster="'+esc(item.img)+'"':'')+'><source src="'+esc(item.video)+'" type="video/mp4"></video>';
  if(item && item.img) return '<img class="thumb" loading="lazy" src="'+esc(item.img)+'" alt="ad creative">';
  return '';
}
function card(c,maxv){
  var v=c.variants, barw=Math.round(100*v/maxv), heavy=v>=8?" heavy":"";
  var media=(c.media&&c.media.length)?c.media:[{img:c.img||"",video:c.video||"",ad:c.ad||""}];
  var m0=media[0], multi=media.length>1;
  var art='<div class="card-art'+((m0.img||m0.video)?'':' noimg')+'" data-media="'+esc(JSON.stringify(media))+'">'
    +'<div class="art-slot">'+mediaEl(m0)+'</div>'
    +'<span class="fmt-badge '+fmtClass(c.fmt)+'">'+esc(c.fmt_label)+'</span>'
    +'<a class="art-meta" href="'+esc(m0.ad)+'" target="_blank" rel="noopener" title="Open this ad in the Meta Ad Library">Meta &#8599;</a>'
    +(multi?'<button type="button" class="art-nav prev" aria-label="Previous variant">&#8249;</button><button type="button" class="art-nav next" aria-label="Next variant">&#8250;</button><span class="art-count">1 / '+media.length+'</span>':'')
    +'</div>';
  return '<article class="card" data-brand="'+esc(c.brand)+'" data-fmt="'+esc(c.fmt)+'">'
    +art
    +'<div class="card-pad">'
    +'<header class="card-top"><span class="chip date">'+esc(c.launched)+'</span></header>'
    +'<h3 class="offer">'+esc(c.title)+'</h3>'
    +'<p class="hook">'+esc(c.hook)+'</p>'
    +'<div class="borrow"><span class="borrow-tag">Borrow</span><p>'+esc(c.note)+'</p></div>'
    +'<footer class="card-foot"><div class="variants'+heavy+'" title="'+v+' near-identical live variants of this creative">'
    +'<span class="vnum">'+v+'×</span><span class="vlabel">live variant'+(v!==1?"s":"")+'</span>'
    +'<span class="vbar"><span style="width:'+barw+'%"></span></span></div>'
    +'<a class="viewad" href="'+esc(m0.ad)+'" target="_blank" rel="noopener">View live ad &#8599;</a></footer>'
    +'</div></article>';
}
function render(d){
  var m=d.meta, maxv=m.maxv;
  var h='<div class="wrap">';
  h+='<header class="mast"><p class="eyebrow">'+esc(d.hero.eyebrow)+'</p>'
    +'<h1>What the rivals <em>shipped</em> this week</h1>'
    +'<p class="lede">'+esc(d.hero.lede)+'</p>'
    +'<div class="runbar">'
    +'<span><span class="k">window</span> <b>'+esc(m.window)+'</b> (last 7 days)</span>'
    +'<span><span class="k">new ads</span> <b>'+m.total_ads+'</b></span>'
    +'<span><span class="k">concepts</span> <b>'+m.total_concepts+'</b></span>'
    +'<span><span class="k">brands live</span> <b>'+m.brands_live+' of '+m.brands_total+'</b></span>'
    +'<span><span class="k">source</span> <b>Meta Ad Library / Apify</b></span></div></header>';
  // summary
  h+='<section class="summary"><h2 class="sec">This week in three reads</h2><div class="sumgrid">';
  d.brands.forEach(function(b){
    h+='<div class="sumcard"><div class="name"><h3>'+esc(b.name)+'</h3>'
      +'<span class="count">'+b.ads+' ads &middot; '+b.concepts+' angles</span></div>'
      +'<p>'+esc(b.strat)+'</p></div>';
  });
  h+='<div class="sumcard dormant"><div class="name"><h3>Dormant</h3><span class="count">no new launches</span></div><ul>';
  d.dormant.forEach(function(x){
    h+='<li><span class="dot"></span><strong>'+esc(x.name)+'</strong> — '+x.ads+' ads still active in '+esc(x.market)+', but <em>no new launches</em> in the 7-day window.</li>';
  });
  h+='</ul></div></div></section>';
  // filters
  h+='<nav class="filters" aria-label="Filter creative"><button class="fb on" data-k="all" data-v="all">All</button>';
  d.brands.forEach(function(b){ h+='<button class="fb" data-k="brand" data-v="'+esc(b.name)+'">'+esc(b.name)+'</button>'; });
  [["VIDEO","Video"],["DCO","Dynamic"],["IMAGE","Static"]].forEach(function(f){
    h+='<button class="fb" data-k="fmt" data-v="'+f[0]+'">'+f[1]+'</button>';
  });
  h+='</nav>';
  // brand sections
  d.brands.forEach(function(b){
    var cs=d.concepts.filter(function(c){return c.brand===b.name;});
    h+='<section class="brand-block"><div class="brand-head"><h2>'+esc(b.name)+'</h2>'
      +'<p class="brand-meta"><strong>'+b.ads+'</strong> new ads this week · <strong>'+b.concepts+'</strong> distinct angles · '+esc(b.fmts)+'</p>'
      +'<p class="brand-strat">'+esc(b.strat)+'</p></div><div class="grid">';
    cs.forEach(function(c){ h+=card(c,maxv); });
    h+='</div></section>';
  });
  // footer
  h+='<footer class="foot"><p>'+esc(d.footer.src)+'</p>'
    +'<p class="gate">'+esc(d.footer.gate)+'</p>'
    +'<p>Generated '+esc(m.generated)+' &middot; CamCom creative strategy</p></footer>';
  h+='</div>';
  return h;
}
function wireFilters(){
  var state={brand:"all",fmt:"all"};
  var btns=document.querySelectorAll('.fb'),cards=document.querySelectorAll('.card'),blocks=document.querySelectorAll('.brand-block');
  btns.forEach(function(b){b.addEventListener('click',function(){
    var k=b.dataset.k,v=b.dataset.v;
    if(k==='all'){state.brand='all';state.fmt='all';} else {state[k]=(state[k]===v?'all':v);}
    btns.forEach(function(x){ if(x.dataset.k==='all') x.classList.toggle('on',state.brand==='all'&&state.fmt==='all'); else x.classList.toggle('on',state[x.dataset.k]===x.dataset.v); });
    cards.forEach(function(c){var ok=(state.brand==='all'||c.dataset.brand===state.brand)&&(state.fmt==='all'||c.dataset.fmt===state.fmt);c.hidden=!ok;});
    blocks.forEach(function(bl){bl.hidden=(bl.querySelectorAll('.card:not([hidden])').length===0);});
  });});
}
function wirePager(){
  document.querySelectorAll('.card-art[data-media]').forEach(function(art){
    var media; try{media=JSON.parse(art.dataset.media);}catch(e){return;}
    if(!media||media.length<2) return;
    var i=0, slot=art.querySelector('.art-slot'),
        meta=art.querySelector('.art-meta'), count=art.querySelector('.art-count'),
        card=art.closest('.card'), viewad=card?card.querySelector('.viewad'):null;
    function show(n){
      i=(n+media.length)%media.length;
      slot.innerHTML=mediaEl(media[i]);
      art.classList.toggle('noimg', !(media[i].img||media[i].video));
      if(meta) meta.href=media[i].ad;
      if(viewad) viewad.href=media[i].ad;
      if(count) count.textContent=(i+1)+' / '+media.length;
    }
    art.querySelector('.art-nav.prev').addEventListener('click',function(e){e.preventDefault();show(i-1);});
    art.querySelector('.art-nav.next').addEventListener('click',function(e){e.preventDefault();show(i+1);});
  });
}

var B64={dec:function(b64){var bin=atob(b64);var u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}};
async function decryptBundle(bundle,password){
  var enc=new TextEncoder();
  var baseKey=await crypto.subtle.importKey("raw",enc.encode(password),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:B64.dec(bundle.salt),iterations:bundle.iter,hash:"SHA-256"},
    baseKey,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:B64.dec(bundle.iv)},key,B64.dec(bundle.ct));
  var bytes=new Uint8Array(pt);
  if(bundle.gzip){
    var ds=new DecompressionStream("gzip");
    var buf=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
    bytes=new Uint8Array(buf);
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function unlock(ev){
  if(ev) ev.preventDefault();
  var pw=document.getElementById('pw').value;
  var errEl=document.getElementById('err'); errEl.textContent="";
  var btn=document.getElementById('go'); btn.disabled=true; btn.textContent="Decrypting…";
  try{
    var bundle=window.__DATA__ || await (await fetch('data.json',{cache:'no-store'})).json();
    var data=await decryptBundle(bundle,pw);
    document.getElementById('gate').remove();
    var app=document.getElementById('app');
    app.innerHTML=render(data);
    app.hidden=false;
    try{ document.title="Rival Watch · The Oodie Set"; }catch(e){}
    wireFilters();
    wirePager();
    try{ sessionStorage.setItem('rw_pw',pw); }catch(e){}
  }catch(e){
    errEl.textContent="Wrong password — try again.";
    btn.disabled=false; btn.textContent="Unlock";
  }
}
window.addEventListener('DOMContentLoaded',function(){
  document.getElementById('gateform').addEventListener('submit',unlock);
  var saved=null; try{saved=sessionStorage.getItem('rw_pw');}catch(e){}
  if(saved){ document.getElementById('pw').value=saved; unlock(); }
});
</script>
</body>
</html>
